[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-aware-code-distiller"
version = "0.1.0"
description = "Context-reducing AST diff summarizer generating minimal, semantically complete code diff summaries for LLM consumption"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
diff-aware-code-distiller = "diff_aware_code_distiller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diff_aware_code_distiller*"]
